global:
  # the image from Docker Hub, as istiod's (istiod-values.yaml)
  hub: docker.io/istio
cni:
  cniConfDir: /etc/cni/net.d
  cniBinDir: /opt/cni/bin
  priorityClassName: system-node-critical
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
