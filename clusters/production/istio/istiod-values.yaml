global:
  # the images from Docker Hub, as every Istio release before 1.30 (whose charts default to registry.istio.io, with
  # announced unavailability windows) and after it
  hub: docker.io/istio
  priorityClassName: system-cluster-critical
  # every injected sidecar's CPU request (the chart's default is 100m); a pod's
  # sidecar.istio.io/proxyCPU annotation still overrides it. Memory and limits keep the chart's defaults.
  proxy:
    resources:
      requests:
        cpu: 50m

cni:
  enabled: true

meshConfig:
  accessLogFile: /dev/stdout
  enableTracing: true
  defaultConfig:
    holdApplicationUntilProxyStarts: true
    tracing:
      zipkin:
        address: schnappy-tempo.schnappy-infra.svc:9411
      sampling: 1.0

pilot:
  env:
    ENABLE_NATIVE_SIDECARS: "false"
    # Istio 1.31 sends unhealthy endpoints to the proxies by default; with one replica an unready pod then gets the
    # traffic (Envoy's panic mode) instead of the caller a fast "no healthy upstream". The behaviour of 1.25-1.30 kept.
    PILOT_AUTO_SEND_UNHEALTHY_ENDPOINTS: "false"
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
