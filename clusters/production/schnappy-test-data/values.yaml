vault:
  secretsEnabled: true
  secretPathPrefix: "secret/data/schnappy-test"

networkPolicies:
  enabled: true

postgres:
  enabled: false
  # the CNPG cluster's instance (cnpg.enabled below) takes these; half the chart's 100m default since 2026-10-01
  resources:
    requests: { memory: "512Mi", cpu: "50m" }
    limits: { memory: "2Gi", cpu: "1000m" }
  databases:
    - name: monitor
    - name: admin
    - name: chat
    - name: chess
    - name: masi

valkey:
  enabled: true
  existingSecret: schnappy-test-valkey
  image: valkey/valkey:8.1-alpine
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

kafka:
  enabled: false
  existingSecret: schnappy-test-kafka
  resources:
    requests: { cpu: 25m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1536Mi }
  retention:
    hours: 24
    bytes: "2147483648"
  storage:
    size: 2Gi
    storageClass: local-path

scylla:
  enabled: false

scylla:
  enabled: false
  resources:
    requests: { cpu: 25m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 512Mi }

scyllaOperator:
  enabled: true
  version: "6.2.3"
  agentVersion: "3.9.0"
  developerMode: true

strimzi:
  enabled: true

cnpg:
  enabled: true
  import: false
  backup: false

aptCache:
  enabled: false
