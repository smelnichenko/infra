vault:
  secretsEnabled: true
  secretPathPrefix: "secret/data/schnappy-test"

networkPolicies:
  enabled: true

postgres:
  enabled: false
  # the CNPG cluster's instance (cnpg.enabled below) takes these; half the chart's 100m default since 2026-10-01
  resources:
    requests: { memory: "512Mi", cpu: "50m" }
    limits: { memory: "2Gi", cpu: "1000m" }
  databases:
    - name: monitor
    - name: admin
    - name: chat
    - name: chess
    # pgvector for masi's face embeddings: a superuser's to create, so CNPG keeps it (schnappy-data cnpg-databases)
    - name: masi
      owner: masi
      extensions: [vector]

valkey:
  enabled: true
  existingSecret: schnappy-test-valkey
  image: valkey/valkey:9.1.2-alpine
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

kafka:
  enabled: false
  existingSecret: schnappy-test-kafka
  resources:
    requests: { cpu: 25m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1536Mi }
  retention:
    hours: 24
    bytes: "2147483648"
  storage:
    size: 2Gi
    storageClass: local-path

scylla:
  enabled: false
  # the schema Job's cqlsh, the cluster's own version
  image: scylladb/scylla:2026.1.14
  # ScyllaDB sizes itself to its memory limit (one shard here, --smp=1): under Seastar's reserve (1.5 GiB) plus 500 MB
  # it takes a flat 500 MB (its log's max_repair_memory, 10 % of a shard: 49.9 MB on 2026-10-14) - at 512Mi that left
  # 36 MiB outside the shard; 1 GiB leaves ~500 MiB. Its request the same - the memory it plans with is then the memory
  # it is promised (with the request under the limit a pressed node takes it back as an OOM kill). The test namespace's
  # quota (16Gi of requests, 48Gi of limits; 5.2Gi and 23.6Gi used on 2026-10-14) holds it
  resources:
    requests: { cpu: 100m, memory: 1Gi }
    limits: { cpu: 1000m, memory: 1Gi }

scyllaOperator:
  enabled: true
  version: "2026.1.14"
  agentVersion: "3.12.1"
  developerMode: true

strimzi:
  enabled: true
  kafkaVersion: 4.3.1

cnpg:
  enabled: true
  import: false
  backup: false
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-bullseye@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533

aptCache:
  enabled: false
