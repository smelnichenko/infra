fullnameOverride: schnappy

prometheus:
  prometheusSpec:
    # No sidecar — scrape merged metrics on port 15020 (plaintext, bypasses mTLS)
    podMetadata:
      labels:
        sidecar.istio.io/inject: "false"
    retention: 15d
    enableFeatures:
      - exemplar-storage
    # Discover ServiceMonitors/PodMonitors/PrometheusRules from all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { cpu: 4000m, memory: 4Gi }
    remoteWrite:
      - url: http://schnappy-mimir.schnappy-infra.svc:9009/api/v1/push
        # Forward the trace_id exemplars Prometheus stores (exemplar-storage) on to
        # Mimir — without this they never leave Prometheus, so Grafana (which queries
        # Mimir) shows no metric->trace exemplar links.
        sendExemplars: true
    # k6 smoke metrics are pushed by the k6 pod straight to Mimir, but the k6
    # PrometheusRules (platform helm/schnappy) are evaluated here. Read them
    # back from Mimir — only for queries that carry source="k6", so nothing
    # else fans out to Mimir.
    remoteRead:
      - url: http://schnappy-mimir.schnappy-infra.svc:9009/prometheus/api/v1/read
        # readRecent is load-bearing: without it Prometheus clamps remote reads
        # to before its own oldest local block, so the k6 rules' [1d] windows
        # would never reach Mimir and the alerts would go silently blind.
        readRecent: true
        requiredMatchers:
          source: k6
    alertingEndpoints:
      - name: schnappy-alertmanager
        namespace: schnappy-infra
        port: http
        scheme: http
        pathPrefix: /
    # KSM scraped separately — PodMonitor relabeling overwrites its pod labels

grafana:
  enabled: false
alertmanager:
  enabled: false
kubeStateMetrics:
  enabled: false
nodeExporter:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false
kubelet:
  enabled: false

prometheusOperator:
  enabled: true
  fullnameOverride: schnappy-prometheus-operator
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  podLabels:
    sidecar.istio.io/inject: "false"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }

defaultRules:
  create: false
