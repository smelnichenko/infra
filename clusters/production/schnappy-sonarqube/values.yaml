vault:
  secretsEnabled: true

networkPolicies:
  enabled: true

gateway:
  enabled: true
  name: schnappy-infra-gateway
  namespace: schnappy-infra
  hosts:
    sonar: sonar.pmon.dev

sonarqube:
  enabled: true
  existingSecret: schnappy-sonarqube
  image: sonarqube:26.9.0.129388-community
  javaOpts: -Xms1g -Xmx1g
  ingress:
    enabled: false
  storage:
    size: 10Gi
    storageClass: local-path
  resources:
    requests: { cpu: 100m, memory: 2Gi }
    limits: { cpu: 2000m, memory: 6Gi }
  postgres:
    image: postgres:19-alpine
  postgresStorage:
    size: 5Gi
    storageClass: local-path
  postgresResources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 512Mi }
  # SonarQube's database on CloudNativePG (ops docs/plans/121; operator, 2026-11-17: "a"). Stage 1 (2026-11-18): its own
  # CNPG cluster imported the sonarqube database from the StatefulSet above (every count equal) and backs up to the Pi
  # store under its own name. Stage 2 (03:00): SonarQube on it - a CI analysis green on it (platform pipeline 590). Stage
  # 3: the import off (a re-created cluster would otherwise re-import the StatefulSet's stage-1 data - plan 121: only a
  # recovery from its own backups re-creates it), the StatefulSet at 0 pods (its volume kept until its removal is decided).
  postgresReplicas: 0
  cnpg:
    enabled: true
    import: false
    storage:
      size: 5Gi
      storageClass: local-path
    backup: true
    backupEndpoint: http://192.168.11.5:9000
    backupServerName: schnappy-sonarqube-pg18
  database: cnpg
  setup:
    enabled: true
    projects:
      - key: schnappy-monitor
        name: Schnappy Monitor
      # pull requests analyse here, as masi's do (2026-11-16)
      - key: schnappy-monitor-pr
        name: Schnappy Monitor (pull requests)
      - key: schnappy-admin
        name: Schnappy Admin
      # pull requests analyse here, as masi's do (2026-11-16)
      - key: schnappy-admin-pr
        name: Schnappy Admin (pull requests)
      - key: schnappy-chat
        name: Schnappy Chat
      # pull requests analyse here, as masi's do (2026-11-16)
      - key: schnappy-chat-pr
        name: Schnappy Chat (pull requests)
      - key: schnappy-chess
        name: Schnappy Chess
      # pull requests analyse here, as masi's do (2026-11-16)
      - key: schnappy-chess-pr
        name: Schnappy Chess (pull requests)
      - key: schnappy-masi
        name: Schnappy Masi
      # pull requests analyse here, so schnappy-masi is written by main alone and always shows main (CE has no branch analysis)
      - key: schnappy-masi-pr
        name: Schnappy Masi (pull requests)
      - key: schnappy-radio-scheduler
        name: Schnappy Radio Scheduler
      # pull requests analyse here, as masi's do
      - key: schnappy-radio-scheduler-pr
        name: Schnappy Radio Scheduler (pull requests)
      - key: schnappy-site
        name: Schnappy Site
        gate: Frontend
      # pull requests analyse here, as masi's do (2026-11-16)
      - key: schnappy-site-pr
        name: Schnappy Site (pull requests)
        gate: Frontend
      - key: schnappy-platform
        name: Schnappy Platform
      # pull requests analyse here, as masi's do (2026-11-16)
      - key: schnappy-platform-pr
        name: Schnappy Platform (pull requests)
      - key: schnappy-ops
        name: Schnappy Ops
      # pull requests analyse here, as masi's do (2026-11-16)
      - key: schnappy-ops-pr
        name: Schnappy Ops (pull requests)
