# Velero's newest patch release; chart 12.2.0 ships v1.18.2. Drop this when the chart's default catches up.
image:
  tag: v1.18.4
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.4
    volumeMounts:
      - name: plugins
        mountPath: /target
credentials:
  useSecret: true
  existingSecret: velero-credentials
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero
      config:
        region: us-east-1
        s3ForcePathStyle: "true"
        s3Url: http://192.168.11.5:9000
  volumeSnapshotLocation: []
  defaultVolumesToFsBackup: true
  features: ""
  # Keep only the most recent maintenance Job per repository (chart default is 3).
  # With 12 BackupRepositories that default leaves 36 completed maintenance pods
  # lingering; one is plenty to inspect the last run on this single node.
  repositoryMaintenanceJob:
    repositoryConfigData:
      global:
        keepLatestMaintenanceJobs: 1
deployNodeAgent: true
snapshotsEnabled: false
# Velero holds manifests only: production's PVs are all local-path hostPath, which Velero's file-system backup never
# copies (none ever was, 2026-11-13: 121 of 121 volume backups were emptyDirs). The data has backups of its own - CNPG
# to its object store, Scylla Manager, the Pis' tier-0 backup. So no volume is read at all: a pod's emptyDirs (Istio's
# sockets and certs, tmp) and what is projected into it hold nothing to restore, and a pod deleted while they were read
# failed the whole backup - masi rolled out at 02:01 UTC 2026-11-13, one minute into the daily run, and its two old
# pods' 12 emptyDirs made it PartiallyFailed (VeleroDailyBackupMissing). hostPath and local skipped too: Velero would
# skip them anyway, but only after opening the kopia repository. A PVC not bound (Pending, Lost - a pod waiting for its
# node, a CI pipeline's) is skipped by phase: with any volume policy Velero resolves every PVC's PV, and one it cannot
# find failed the backup where before the policy it was passed over.
extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: velero-skip-ephemeral-volumes
      namespace: velero
    data:
      policy.yaml: |
        version: v1
        volumePolicies:
          - conditions:
              volumeTypes: [emptyDir, hostPath, local, configMap, secret, projected, downwardAPI]
            action:
              type: skip
          - conditions:
              pvcPhase: [Pending, Lost]
            action:
              type: skip
schedules:
  schnappy-daily:
    disabled: false
    schedule: "0 2 * * *"
    useOwnerReferencesInBackup: false
    template:
      ttl: 168h
      includedNamespaces:
        - schnappy-production
      defaultVolumesToFsBackup: true
      resourcePolicy:
        kind: configmap
        name: velero-skip-ephemeral-volumes
  full-weekly:
    disabled: false
    schedule: "0 3 * * 0"
    useOwnerReferencesInBackup: false
    template:
      ttl: 720h
      includedNamespaces:
        - "*"
      # Velero's own namespace: no data (no PVC), everything there Argo's or Velero's to recreate. Its hourly
      # repository maintenance Jobs' pods (unlabelled: Velero makes them) would fail this backup the way hyperfoil's
      # and etcd-backup's pods did, ending while it reads their volumes - none has yet; this keeps it so
      excludedNamespaces:
        - velero
      defaultVolumesToFsBackup: true
      resourcePolicy:
        kind: configmap
        name: velero-skip-ephemeral-volumes
upgradeCRDs: false
kubectl:
  image:
    repository: docker.io/bitnami/kubectl
    tag: latest
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
