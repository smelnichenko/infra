# Velero's newest patch release; chart 12.2.5 ships v1.18.2. Drop this when the chart's default catches up.
image:
  tag: v1.18.4
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.4
    volumeMounts:
      - name: plugins
        mountPath: /target
credentials:
  useSecret: true
  existingSecret: velero-credentials
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero
      config:
        region: us-east-1
        s3ForcePathStyle: "true"
        s3Url: http://192.168.11.5:9000
  volumeSnapshotLocation: []
  # no volume read by a backup that does not ask (an ad-hoc one, not from a schedule): the schedules below say the same
  # for theirs; a backup that wants the file-system path sets it itself (the Vagrant copy's restore check does)
  defaultVolumesToFsBackup: false
  features: ""
  # Keep only the most recent maintenance Job per repository (chart default is 3).
  # With 12 BackupRepositories that default leaves 36 completed maintenance pods
  # lingering; one is plenty to inspect the last run on this single node.
  repositoryMaintenanceJob:
    repositoryConfigData:
      global:
        keepLatestMaintenanceJobs: 1
deployNodeAgent: true
snapshotsEnabled: false
# Velero holds manifests only, and reads no volume: production's PVs are all local-path hostPath, which its file-system
# backup never copies (121 of 121 volume backups of 2026-11-13 were emptyDirs - Istio's sockets and certs, tmp).
# Reading a pod's emptyDirs failed whole backups: a pod replaced while they were read - masi rolled out at 02:01 UTC
# 2026-11-13, one minute into the daily run, and its two old pods' 12 emptyDirs made it PartiallyFailed
# (VeleroDailyBackupMissing). Pods are left out of both schedules: the volume backup runs only for a pod item, so none
# runs and no kopia repository is opened. A PVC is still backed up, with its PV object.
# Data: backed up by its own store - Postgres (CNPG's base backups and WAL to the Pi store), ScyllaDB (Scylla
# Manager), the Pis' tier-0 backup; by none - Kafka, ClickHouse, Grafana, Alertmanager, Mimir and Tempo (s3gw),
# OpenSearch (rebuilt from Postgres), Valkey (a cache), woodpecker's Postgres (a CNPG cluster without a backup) - a
# loss as before this change: Velero never held their volumes.
# On a restore: the pods come back from their controllers (Deployments, StatefulSets, Jobs, CNPG's Clusters, Strimzi's
# pod sets - production runs no bare pod, 2026-11-13), every data volume fresh and empty - each store's data from its
# own backup.
schedules:
  schnappy-daily:
    disabled: false
    schedule: "0 2 * * *"
    useOwnerReferencesInBackup: false
    template:
      ttl: 168h
      includedNamespaces:
        - schnappy-production
      excludedResources:
        - pods
      defaultVolumesToFsBackup: false
  full-weekly:
    disabled: false
    schedule: "0 3 * * 0"
    useOwnerReferencesInBackup: false
    template:
      ttl: 720h
      includedNamespaces:
        - "*"
      # Velero's own namespace (no PVC: Argo and Velero recreate everything there); CI's (its pipelines' namespaces
      # and pods made and removed while a backup runs; its server's Postgres has no backup anywhere, see Data above);
      # the preview environments' (each pull request's own, recreated from it)
      excludedNamespaces:
        - velero
        - woodpecker
        - "schnappy-pr-*"
      # and the cluster's own resources: with any namespace excluded Velero leaves cluster-scoped kinds out unless
      # asked (ClusterRoles and their bindings, StorageClasses, webhooks, ClusterIssuers, cluster-wide network
      # policies, PriorityClasses) - the weekly held none of them since its first exclusion (2026-10-11)
      includeClusterResources: true
      excludedResources:
        - pods
      defaultVolumesToFsBackup: false
upgradeCRDs: false
kubectl:
  image:
    repository: docker.io/bitnami/kubectl
    tag: latest
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
