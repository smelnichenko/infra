# Velero's newest patch release; chart 12.2.0 ships v1.18.2. Drop this when the chart's default catches up.
image:
  tag: v1.18.4
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.4
    volumeMounts:
      - name: plugins
        mountPath: /target
credentials:
  useSecret: true
  existingSecret: velero-credentials
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero
      config:
        region: us-east-1
        s3ForcePathStyle: "true"
        s3Url: http://192.168.11.5:9000
  volumeSnapshotLocation: []
  defaultVolumesToFsBackup: true
  features: ""
  # Keep only the most recent maintenance Job per repository (chart default is 3).
  # With 12 BackupRepositories that default leaves 36 completed maintenance pods
  # lingering; one is plenty to inspect the last run on this single node.
  repositoryMaintenanceJob:
    repositoryConfigData:
      global:
        keepLatestMaintenanceJobs: 1
deployNodeAgent: true
snapshotsEnabled: false
# Velero holds manifests only, and reads no volume: production's PVs are all local-path hostPath, which its file-system
# backup never copies (121 of 121 volume backups of 2026-11-13 were emptyDirs - Istio's sockets and certs, tmp); the
# data has backups of its own (CNPG to its object store, Scylla Manager, the Pis' tier-0 backup). Reading a pod's
# emptyDirs failed whole backups: a pod replaced while they were read - masi rolled out at 02:01 UTC 2026-11-13, one
# minute into the daily run, and its two old pods' 12 emptyDirs made it PartiallyFailed (VeleroDailyBackupMissing).
# Pods are left out of both schedules: the volume backup runs only for a pod item, so none runs - no policy, no PV
# looked up, no kopia repository opened - and on a restore every pod comes back from its Deployment, StatefulSet or
# Job (production runs no bare pod, 2026-11-13). defaultVolumesToFsBackup off says the same, should pods come back.
schedules:
  schnappy-daily:
    disabled: false
    schedule: "0 2 * * *"
    useOwnerReferencesInBackup: false
    template:
      ttl: 168h
      includedNamespaces:
        - schnappy-production
      excludedResources:
        - pods
      defaultVolumesToFsBackup: false
  full-weekly:
    disabled: false
    schedule: "0 3 * * 0"
    useOwnerReferencesInBackup: false
    template:
      ttl: 720h
      includedNamespaces:
        - "*"
      # Velero's own namespace: no data (no PVC), everything there Argo's or Velero's to recreate. Its hourly
      # repository maintenance Jobs' pods (unlabelled: Velero makes them) would fail this backup the way hyperfoil's
      # and etcd-backup's pods did, ending while it reads their volumes - none has yet; this keeps it so
      # and CI's and the preview environments': each pipeline's and each pull request's own, made and removed while a
      # backup runs, nothing in them to restore (Argo recreates the rest)
      excludedNamespaces:
        - velero
        - woodpecker
        - "schnappy-pr-*"
      excludedResources:
        - pods
      defaultVolumesToFsBackup: false
upgradeCRDs: false
kubectl:
  image:
    repository: docker.io/bitnami/kubectl
    tag: latest
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi
