# The key the Woodpecker server signs its agents' gRPC tokens with, kept across restarts. Unset, the server generates a
# temporary one at every start, so a restart (a liveness kill while ten was loaded, 2026-10-19 06:03) left the agent's
# token invalid and killed the pipeline it was running. The server's alone: the agents never need it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-grpc-secret
  namespace: woodpecker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: woodpecker-grpc-secret
  data:
    - secretKey: WOODPECKER_GRPC_SECRET
      remoteRef:
        key: secret/data/schnappy/woodpecker
        property: grpc-secret
