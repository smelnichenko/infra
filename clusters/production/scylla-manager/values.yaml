# Scylla Manager 3.12.1, the 3.12 line's newest (the chart v1.22.0 ships 3.12.0); by digest as the chart pins its own
image:
  tag: 3.12.1@sha256:ba54287094e7097fb6685717187dca4bee304130b5fbdde1473e70e2bc6e998a

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

scylla:
  # the backend cluster's agent with the Manager, 3.12.1 (the chart ships 3.12.0) - by digest as the chart pins its own
  agentImage:
    tag: 3.12.1@sha256:f47697d38da94a1e367286d232783199abb7477db026febfd125ee3b2aded7b0
  developerMode: true
  datacenter: manager-dc
  racks:
    - name: manager-rack
      members: 1
      storage:
        capacity: 5Gi
        storageClassName: local-path
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      # the operator's webhook fills this default in on every apply; stated here so Argo's server-side apply does not
      # predict its removal and loop OutOfSync (the drift 808c943 once hid by ignoring the whole .spec)
      agentResources:
        requests:
          cpu: 50m
          memory: 10M
      placement: {}

# Scylla Manager's own metrics scraped: its scheduler's last success and runs per task (the backup and repair alerts
# read them). Prometheus reaches it through schnappy-infra's default-deny (its scylla-manager egress rule).
serviceMonitor:
  create: true
