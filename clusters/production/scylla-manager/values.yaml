resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

scylla:
  developerMode: true
  datacenter: manager-dc
  racks:
    - name: manager-rack
      members: 1
      storage:
        capacity: 5Gi
        storageClassName: local-path
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      # the operator's webhook fills this default in on every apply; stated here so Argo's server-side apply does not
      # predict its removal and loop OutOfSync (the drift 808c943 once hid by ignoring the whole .spec)
      agentResources:
        requests:
          cpu: 50m
          memory: 10M
      placement: {}
