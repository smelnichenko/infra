vault:
  secretsEnabled: true
  secretPathPrefix: "secret/data/schnappy"

networkPolicies:
  enabled: true

postgres:
  enabled: false

valkey:
  enabled: false

kafka:
  enabled: false

scylla:
  enabled: false

scyllaOperator:
  enabled: false

# versitygw — the in-cluster S3 object store (Mimir/Tempo blocks, hyperfoil reports).
# Cross-namespace reads allowed for Hyperfoil (production) + reports (infra). PVC
# sized above the ~20G payload (node has ~600G free).
s3gw:
  enabled: true
  existingSecret: schnappy-infra-minio
  allowCrossNamespace: true
  buckets:
    - mimir-blocks
    - tempo-traces
    - hyperfoil-reports
  storage:
    size: 30Gi
    storageClass: local-path
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

strimzi:
  enabled: false

cnpg:
  enabled: false

aptCache:
  enabled: true
  resources:
    requests: { cpu: 25m, memory: 32Mi, ephemeral-storage: 64Mi }
    limits: { cpu: 200m, memory: 128Mi, ephemeral-storage: 256Mi }
  storage:
    size: 10Gi
    storageClass: local-path
