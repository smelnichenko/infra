# Cilium-specific quirk: pod→kube-apiserver traffic does NOT match the standard
# NetworkPolicy `ipBlock: 10.43.0.1/32` egress rule in network-policy.yaml.
# With kube-proxy replacement + socket-LB, Cilium DNATs the apiserver ClusterIP
# (10.43.0.1:443) to the backend node host IP (192.168.11.2:6443) at the source
# socket, then evaluates egress policy against the post-DNAT destination — the
# `host` entity. The ipBlock never matches that, so the controller's REST-mapper
# discovery (GET https://10.43.0.1:443/api) is dropped at SYN, controller-runtime
# manager setup loops on the failed apiserver call, and :8083 never serves Ready.
#
# `toEntities: host` is the established cluster convention for this exact
# pod→node-host-IP class of traffic (see the smartctl-exporter CNP in
# schnappy-observability, and the note already in network-policy.yaml / memory
# feedback_cilium_pod_to_node_ip). `host` matches the node's IPs regardless of
# interface (cilium_host, eth0, etc.). endpointSelector {} scopes to all kagent
# pods (controller, tools, and the dynamically-spawned agent pods all legitimately
# call the apiserver), mirroring the podSelector {} scope of kagent-default.
# This is the Cilium belt-and-suspenders pair to the k8s ipBlock rule
# (feedback_np_k8s_api): the existing network-policy.yaml stays untouched and
# Cilium evaluates the union of both.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-apiserver-egress
  namespace: kagent
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
# The k8s NetworkPolicy cross-namespace INGRESS rules (network-policy.yaml) — the
# Istio gateway -> oauth2-proxy(4180)/ui(8080), and Prometheus -> metrics(8085/8443)
# — use a combined namespaceSelector+podSelector. In this cluster those k8s-NP rules
# are NOT honored for kagent: Hubble shows the gateway SYN to oauth2-proxy:4180 as
# "policy-verdict:none ... Policy denied DROPPED", and Prometheus scrapes to
# :8085/:8443 are likewise dropped, while the intra-namespace rule (podSelector-only)
# works fine. Both failing rules are the cross-ns ns+pod-selector kind. Express the
# same allows natively as CiliumNetworkPolicy ingress (fromEndpoints), which Cilium
# computes reliably; the k8s-NP rules stay in place as the belt-and-suspenders pair
# (feedback_np_k8s_api). fromEndpoints uses the io.kubernetes.pod.namespace special
# label to scope the source namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kagent-crossns-ingress
  namespace: kagent
spec:
  endpointSelector: {}
  ingress:
    # Istio gateway (schnappy-infra) -> oauth2-proxy (4180) and ui (8080).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: schnappy-infra
            gateway.istio.io/managed: istio.io-gateway-controller
      toPorts:
        - ports:
            - port: "4180"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    # Prometheus (schnappy-infra) -> tools metrics (8085) + controller metrics (8443).
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: schnappy-infra
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8085"
              protocol: TCP
            - port: "8443"
              protocol: TCP
