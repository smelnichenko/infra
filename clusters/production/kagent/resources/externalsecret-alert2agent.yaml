# Secrets for the alert2agent adapter, synced from Vault by ESO:
#   ALERTMANAGER_WEBHOOK_SECRET — the shared Bearer Alertmanager presents on the
#       webhook; the SAME value Alertmanager itself reads (secret/schnappy/alertmanager
#       property webhook_secret), so the two ends can't drift.
#   SMTP_PASSWORD — Resend SMTP password (secret/schnappy/mail property password),
#       the same credential Alertmanager uses to send its own alert emails.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alert2agent
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alert2agent
  data:
    - secretKey: ALERTMANAGER_WEBHOOK_SECRET
      remoteRef:
        key: secret/data/schnappy/alertmanager
        property: webhook_secret
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: secret/data/schnappy/mail
        property: password
