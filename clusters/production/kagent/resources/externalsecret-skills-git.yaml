# Read-only Forgejo token for the agents' Skills (RAG) git clones. The kagent
# skills-init container clones the runbooks/plan-doc subtrees from the PRIVATE
# git.pmon.dev/schnappy repos; gitAuthSecretRef on each Agent points here and the
# skills-init expects a `token` key for HTTPS auth.
#
# Reuses the existing read-only token Argo CD already uses (Vault secret/argocd/
# forgejo-readonly, property `token`, seeded by seed-vault-secrets.yml from
# FORGEJO_READONLY_TOKEN). No new credential to mint.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-skills-git
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kagent-skills-git
  data:
    - secretKey: token
      remoteRef:
        key: secret/data/argocd/forgejo-readonly
        property: token
