# Anthropic API key for the kagent ModelConfigs, synced from Vault by ESO.
# The key already lives at secret/schnappy/ai property api_key (seeded by
# seed-vault-secrets.yml for the monitor AI feature) — reused here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-anthropic
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kagent-anthropic
    # kagent is DISABLED and holds NO API key. What is written into its Secret is this placeholder, not the value
    # fetched below: on 2026-09-15 alert2agent turned one gateway incident (nine critical alerts) into five k8s-agent
    # runs on the same root cause - 108 model calls in four minutes, the whole Anthropic balance. To bring kagent back:
    # give it a key of ITS OWN with a spend limit in the Anthropic console (never the shared schnappy/ai key), delete
    # this template, set the agents and alert2agent back to one replica, and cap alert2agent per incident first.
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        ANTHROPIC_API_KEY: "disabled-2026-09-21-no-key"
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: secret/data/schnappy/ai
        property: api_key
