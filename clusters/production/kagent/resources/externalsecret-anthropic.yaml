# Anthropic API key for the kagent ModelConfigs, synced from Vault by ESO.
# The key already lives at secret/schnappy/ai property api_key (seeded by
# seed-vault-secrets.yml for the monitor AI feature) — reused here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-anthropic
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kagent-anthropic
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: secret/data/schnappy/ai
        property: api_key
