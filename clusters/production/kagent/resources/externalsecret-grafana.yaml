# Read-only Grafana Viewer service-account token for kagent's grafana-mcp, synced
# from Vault by ESO. The bundled grafana-mcp (mcp-grafana) reads it via the chart's
# grafana-mcp.grafana.secretRef as GRAFANA_SERVICE_ACCOUNT_TOKEN, and uses it to
# call the Grafana API on behalf of the observability-agent's Grafana tools.
#
# PREREQUISITE: seed Vault secret/schnappy/kagent-grafana (property `token`) with a
# Grafana *Viewer* (read-only) service-account token first. Values are not invented
# here. The token is minted via the Grafana API (see scratchpad grafana-sa.sh).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-grafana
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kagent-grafana
  data:
    - secretKey: GRAFANA_SERVICE_ACCOUNT_TOKEN
      remoteRef:
        key: secret/data/schnappy/kagent-grafana
        property: token
