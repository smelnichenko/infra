# Exposes the kagent console at kagent.pmon.dev. Traffic lands on the
# oauth2-proxy (not the UI directly), so Keycloak login is enforced before the
# agent console is reachable. The proxy forwards to kagent-ui upstream after auth.
# Attaches cross-namespace to the prod gateway (the gateway allows routes from All).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent
  namespace: kagent
spec:
  hostnames:
    - kagent.pmon.dev
  # The Gateway-API-defaulted fields (parentRefs group/kind, backendRefs group/kind/
  # weight, the implicit match-all path) are spelled out explicitly: the kagent Argo
  # app uses ServerSideApply, which compares against the apiserver-defaulted live
  # object and would otherwise flag these defaults as perpetual drift (OutOfSync).
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: schnappy-infra-gateway
      namespace: schnappy-infra
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kagent-oauth2-proxy
          port: 4180
          weight: 1
