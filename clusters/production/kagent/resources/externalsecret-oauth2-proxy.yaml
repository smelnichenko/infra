# OIDC credentials for the oauth2-proxy that gates the kagent UI, synced from
# Vault by ESO. The three keys are what oauth2-proxy's existingSecret expects:
#   client-id      — the Keycloak `kagent-ui` confidential client id
#   client-secret  — that client's secret
#   cookie-secret  — 32-byte random for cookie session encryption
#
# PREREQUISITE: these must be seeded at Vault path secret/schnappy/kagent-oauth
# and a Keycloak `kagent-ui` confidential client (redirect
# https://kagent.pmon.dev/oauth2/callback) must exist before deploy. See the
# plan doc; values are NOT invented here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-oauth2-proxy
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kagent-oauth2-proxy
  data:
    - secretKey: client-id
      remoteRef:
        key: secret/data/schnappy/kagent-oauth
        property: client_id
    - secretKey: client-secret
      remoteRef:
        key: secret/data/schnappy/kagent-oauth
        property: client_secret
    - secretKey: cookie-secret
      remoteRef:
        key: secret/data/schnappy/kagent-oauth
        property: cookie_secret
