vault:
  secretsEnabled: true
  secretPathPrefix: "secret/data/schnappy-test"

app:
  replicas: 1
  javaOpts: -Xmx1g -XX:+UseZGC
  image:
    pullPolicy: IfNotPresent
    repository: git.pmon.dev/schnappy/monitor
    tag: "a7f6881"  # monitor
  ingress:
    enabled: false
  resources:
    requests: { cpu: 50m, memory: 512Mi }
    limits: { cpu: 2000m, memory: 2Gi }

site:
  enabled: true
  replicas: 1
  dnsResolver: "10.43.0.10"
  image:
    pullPolicy: IfNotPresent
    repository: git.pmon.dev/schnappy/site
    tag: "54db45e"  # site
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 500m, memory: 128Mi }

games:
  - name: game-scp
    path: game
    image:
      repository: git.pmon.dev/schnappy/game-scp
      tag: "216c611"  # game-scp
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 100m, memory: 128Mi }

auth:
  existingSecret: schnappy-test-auth
  registrationEnabled: true
  secureCookies: true
  tokenExpiration: 1h
  registrationApproval:
    mode: ai
    defaultGroup: Users

captcha:
  enabled: false

chess:
  enabled: true

chat:
  e2eEnabled: false

monitor:
  enabled: true
  http:
    connectTimeout: 10s
    readTimeout: 30s
    userAgent: MonitorBot/1.0

networkPolicies:
  enabled: true

strimzi:
  enabled: true

cnpg:
  enabled: true

scyllaOperator:
  enabled: true

ai:
  enabled: true
  existingSecret: schnappy-test-ai
  model: claude-haiku-4-5-20251001

mail:
  # monitor's and admin's mails stay off in test. The server settings below are what masiService.mail uses (its own
  # switch pulls in the Vault secret schnappy-test/mail on its own).
  enabled: false
  host: smtp.resend.com
  port: "587"
  username: resend
  fromAddress: noreply@pmon.dev

webhook:
  enabled: false

admin:
  enabled: true
  image:
    repository: git.pmon.dev/schnappy/admin
    pullPolicy: IfNotPresent
    tag: "dcc864c"  # admin
  replicas: 1
  javaOpts: -Xmx512m -XX:+UseZGC
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }

chatService:
  enabled: true
  image:
    repository: git.pmon.dev/schnappy/chat
    pullPolicy: IfNotPresent
    tag: "f8f9811"  # chat
  replicas: 1
  javaOpts: -Xmx512m -XX:+UseZGC
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }

chessService:
  enabled: true
  image:
    repository: git.pmon.dev/schnappy/chess
    pullPolicy: IfNotPresent
    tag: "85e23a7"  # chess
  replicas: 1
  javaOpts: -Xmx512m -XX:+UseZGC
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }

# masi — job registry with reviewed CV tuning (/api/masi). tuning.auto stays off and the
# daily budget is 1 USD: the test namespace must never spend real money on its own. AI stays
# disabled until MASI_ANTHROPIC_API_KEY is seeded (ops .env → Vault <prefix>/ai-masi).
masiService:
  enabled: true
  image:
    repository: git.pmon.dev/schnappy/masi
    pullPolicy: IfNotPresent
    tag: "3a6eb47"  # masi
  replicas: 1
  javaOpts: -Xmx512m -XX:+UseZGC
  resources:
    requests: { cpu: 50m, memory: 384Mi }
    limits: { cpu: 1000m, memory: 1Gi }
  ai:
    # on since 2026-09-21: Vault schnappy-test/ai-masi is seeded (for now with the SHARED Anthropic key, see ops/.env).
    # Nothing spends by itself: tuning.auto and analysis.auto stay off; a Prepare in the UI is what costs.
    enabled: true
    existingSecret: "schnappy-test-masi-ai"
    dailyBudgetUsd: "1"
    monthlyBudgetUsd: "10"
  tuning:
    auto: false
  mail:
    # the weekly digest to every enabled user with an active CV master (in test: the one test user). Figures and
    # company names only. One SMTP egress rule comes with it.
    enabled: true
    siteUrl: https://test.pmon.dev
    # nothing is mailed on a schedule (weeklyAuto stays false): a digest leaves when somebody asks for it
    # ("mail me this report"). And whoever asks, test mails the operator — never an address from its user table.
    deliverAllTo: sergei.melnichenko@gmail.com
  browser:
    enabled: true
    existingSecret: schnappy-test-masi-browser
    resources:
      requests: { cpu: 50m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 1536Mi, ephemeral-storage: 2Gi }

tracing:
  enabled: true
  samplingProbability: "1.0"

# k6 smoke runs in production only (operator decision 2026-09-09): no PostSync
# hook and no k6 alerts for the test namespace.
smokeTest:
  enabled: false

hyperfoil:
  enabled: false

postgres:
  database: monitor
  existingSecret: schnappy-test-postgres
valkey:
  existingSecret: schnappy-test-valkey
minio:
  existingSecret: schnappy-test-minio
alertmanager:
  enabled: false
keycloak:
  enabled: false
  hostname: auth.pmon.dev
