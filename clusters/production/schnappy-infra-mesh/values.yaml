scyllaOperator:
  enabled: false

peerAuthentication:
  enabled: true
  mode: STRICT

authorizationPolicies:
  enabled: false

gateway:
  enabled: true
  infraOnly: true
  replicas: 2
  loadBalancerIP: "192.168.11.2"
  allowedNamespaces:
    - schnappy-production
    - schnappy-test
  tls:
    clusterIssuer: letsencrypt-prod
  hosts:
    app: pmon.dev
    argocd: cd.pmon.dev
    ci: ci.pmon.dev
    hubble: hubble.pmon.dev

# Publish the Pi-hosted Keycloak's OIDC surface (schnappy realm only)
# through the gateway so public-internet clients can log in. Paired with
# the explicit gateway->VIP:443 egress rule in
# cluster-config/schnappy-infra-default-deny.yaml.
keycloakExternal:
  enabled: true
  address: "192.168.11.5"

jwt:
  enabled: true
  issuer: https://auth.pmon.dev/realms/schnappy
  jwksUri: https://auth.pmon.dev/realms/schnappy/protocol/openid-connect/certs
  passthroughHosts:
    - git.pmon.dev
    - sonar.pmon.dev
    - ci.pmon.dev
    - auth.pmon.dev
    - cd.pmon.dev
    - grafana.pmon.dev
    - logs.pmon.dev
    - reports.pmon.dev
    - hubble.pmon.dev
    - alerts.pmon.dev
    - runbooks.pmon.dev
    # kagent does its own SSO (oauth2-proxy → Keycloak, cookie session), so the
    # gateway must not also enforce a Bearer JWT on its host — same as grafana/logs.
    - kagent.pmon.dev
