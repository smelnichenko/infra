scyllaOperator:
  enabled: true

peerAuthentication:
  enabled: true
  mode: STRICT
  # the observability stack runs in schnappy-infra alone: no Alertmanager or s3gw plaintext exception here
  observability: false

authorizationPolicies:
  enabled: true

gateway:
  enabled: false
  external:
    enabled: true
    gatewayName: schnappy-infra-gateway
    gatewayNamespace: schnappy-infra
    hostname: pmon.dev

jwt:
  enabled: false
