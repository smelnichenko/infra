vault:
  secretsEnabled: true

alerts:
  enabled: true

networkPolicies:
  enabled: true

postgres:
  enabled: false
  existingSecret: schnappy-production-postgres
  image: postgres:17-alpine
  databases:
    - name: monitor
    - name: admin
    - name: chat
    - name: chess
    - name: masi
  sharedBuffers: 512MB
  effectiveCacheSize: 2GB
  workMem: 32MB
  maintenanceWorkMem: 128MB
  maxParallelWorkersPerGather: 4
  maxParallelWorkers: 6
  maxWorkerProcesses: 10
  effectiveIoConcurrency: 200
  randomPageCost: "1.1"
  storage:
    size: 20Gi
    storageClass: local-path
  resources:
    requests: { cpu: 750m, memory: 1Gi, ephemeral-storage: 256Mi }
    limits: { cpu: 4000m, memory: 2Gi, ephemeral-storage: 1Gi }

valkey:
  enabled: true
  existingSecret: schnappy-production-valkey
  image: valkey/valkey:9.1.2-alpine
  resources:
    requests: { cpu: 50m, memory: 64Mi, ephemeral-storage: 64Mi }
    limits: { cpu: 1000m, memory: 512Mi, ephemeral-storage: 256Mi }

kafka:
  enabled: false
  existingSecret: schnappy-production-kafka
  clusterId: ""
  image: apache/kafka:4.2.0
  javaOpts: -Xmx1g -Xms1g
  retention:
    hours: 168
    bytes: "10737418240"
  storage:
    size: 10Gi
    storageClass: local-path
  resources:
    requests: { cpu: 125m, memory: 1536Mi, ephemeral-storage: 256Mi }
    limits: { cpu: 2000m, memory: 2Gi, ephemeral-storage: 1Gi }
  topics:
    - name: chat.messages
      partitions: 12
      replicationFactor: 1
    - name: user.events
      partitions: 3
      replicationFactor: 1
    # Realtime envelope topics — apps publish here; Centrifugo (Kafka
    # async-consumer) fans out to subscribers, ClickHouse Kafka engine
    # archives for analytics.
    - name: events.chat.messages
      partitions: 12
      replicationFactor: 1
    - name: events.chess.moves
      partitions: 6
      replicationFactor: 1
    - name: events.notifications
      partitions: 3
      replicationFactor: 1

scylla:
  enabled: false
  image: scylladb/scylla:2026.1.14
  replicas: 1
  datacenter: datacenter1
  args:
    - --smp=2
    - --memory=2G
    - --overprovisioned=1
  storage:
    size: 20Gi
    storageClass: local-path
  # the operator runs one shard per core of the CPU limit (--smp) and ScyllaDB sizes itself to the memory limit less
  # Seastar's reserve - by default max(1.5 GiB, 7 %): 2 GiB would leave two shards 256 MiB each. With the reserve at
  # 512M (scyllaOperator.scyllaArgs) the two shards get ~768 MiB each (4 shards of ~600 MB on 4Gi until 2026-10 - each
  # shard's max_repair_memory, 10 % of it, in ScyllaDB's log). The memory request the same as the limit - the memory it
  # plans with is promised (with the request under the limit a pressed node takes it back as an OOM kill). The first
  # restart on two shards reshards the data
  resources:
    requests: { cpu: 100m, memory: 2Gi, ephemeral-storage: 256Mi }
    limits: { cpu: 2000m, memory: 2Gi, ephemeral-storage: 1Gi }

scyllaOperator:
  enabled: true
  version: "2026.1.14"
  agentVersion: "3.12.1"
  developerMode: true
  # Seastar's reserve outside the shards (see scylla.resources)
  scyllaArgs: "--reserve-memory 512M"
  backupEndpoint: http://192.168.11.5:9000
  # Legacy `backups[]` removed — superseded by scyllaManager.backup
  # (which uses the ScyllaDBManagerTask CRD). Both blocks were active
  # at once and emitted duplicate daily-backup tasks pointing at
  # different buckets, both nonexistent in the backup store.
  scyllaManager:
    enabled: true
    backup:
      enabled: true
      cron: "0 3 * * *"
      retention: 7
      # The Pi backup store (192.168.11.5) hosts the canonical scylla-backups
      # bucket (preexisting). Don't invent a new bucket name —
      # just point at what's already there.
      location: "s3:scylla-backups"
    repair:
      enabled: true
      cron: "0 4 * * 0"
      intensity: 1.0
      parallel: 1
      smallTableThreshold: "1Gi"

strimzi:
  enabled: true
  kafkaVersion: 4.3.1

cnpg:
  enabled: true
  instances: 2   # primary + 1 streaming replica — pod-level HA; CNPG manages PDB/failover
  import: false
  recovery: false
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-bullseye@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  backup: true
  backupEndpoint: http://192.168.11.5:9000
  # PostgreSQL 18 archives under its own name: pg_upgrade starts the new major at timeline 1, and the 17 history
  # (timeline 3) stays where it is - the undo recovers from it
  backupServerName: schnappy-production-postgres-pg18
  # a disaster recovery (recovery: true) reads PostgreSQL 18's archive - without this it reads the cluster's own name,
  # 17's. The recovered cluster then needs a new backupServerName: CNPG archives only into an empty one
  recoveryServerName: schnappy-production-postgres-pg18
  backupSecret: schnappy-production-backup-store
  backupAccessKeyName: ACCESS_KEY
  backupSecretKeyName: SECRET_KEY

aptCache:
  enabled: false
