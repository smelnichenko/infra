# Forgejo readonly token consumed by the schnappy-pr-envs ApplicationSet
# (PullRequest generator) and the stale-PR sweeper. Vault path:
#   secret/argocd/forgejo-readonly { token: <argocd-reader's read:repository token>, username: argocd-reader }
# (ops setup-argocd-reader.yml; the same token is forgejo-repo-creds.yaml's repo-creds password)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-readonly-token
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: forgejo-readonly-token
  data:
    - secretKey: token
      remoteRef:
        key: argocd/forgejo-readonly
        property: token
