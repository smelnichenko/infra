# PR-env cleanup policy + Vault GC.
#
# Daily sweep that:
#   1. For every Argo CD Application labelled preview-env=true (i.e.
#      schnappy-pr-<N>): if the source PR has been closed > 24h, OR
#      head SHA hasn't changed in > 7d, force-prune.
#   2. For every Vault prefix matching `secret/schnappy-pr-*/`: if no
#      live Argo CD Application matches, purge the entire prefix
#      (calls the Vault metadata DELETE API for full purge — same as
#      `task deploy:delete-environment`).
#
# Vault: read against its CA (argocd/vault-pi-ca, from `bootstrap.sh vault-eso`) with a scoped periodic token
# (setup-vault-cleanup-policy.yml, synced by ESO into vault-cleanup-token), renewed at every run. No token: the GC is
# skipped. Any failure fails the Job. Times are read by jq (busybox date reads no RFC 3339).
# Tests: tests/stale-pr-envs-sweeper/run.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stale-pr-envs-sweeper
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stale-pr-envs-sweeper
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stale-pr-envs-sweeper
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: stale-pr-envs-sweeper
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stale-pr-envs-sweeper
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-cleanup-token
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: vault-cleanup-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: argocd/vault-cleanup-token
        property: token
---
# its pods reach Vault (argocd's own policy allows the Pis on Forgejo's ports only)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stale-pr-envs-sweeper
  namespace: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stale-pr-envs-sweeper
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 192.168.11.5/32 }
      ports:
        - { protocol: TCP, port: 8200 }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stale-pr-envs-sweeper
  namespace: argocd
spec:
  schedule: "0 6 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      # a pod that cannot start (its CA Secret missing) ends the Job Failed instead of holding the next runs off
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: stale-pr-envs-sweeper
            # out of Velero's backups: a run ending while the weekly backup reads its emptyDir fails that backup
            velero.io/exclude-from-backup: "true"
        spec:
          restartPolicy: Never
          serviceAccountName: stale-pr-envs-sweeper
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: sweeper
              image: alpine/k8s:1.35.9
              env:
                - name: FORGEJO_API
                  value: https://git.pmon.dev/api/v1
                - name: FORGEJO_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: forgejo-readonly-token
                      key: token
                # Use the same address ESO uses (Pi VIP, port 8200);
                # vault.pmon.dev isn't fronted by Caddy.
                - name: VAULT_ADDR
                  value: https://192.168.11.5:8200
                - name: VAULT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: vault-cleanup-token
                      key: token
                      optional: true
                - name: STALE_DAYS
                  value: "7"
                - name: CLOSED_GRACE_HOURS
                  value: "24"
              command:
                - sh
                - -c
                - |
                  set -eu
                  set -o pipefail
                  now_epoch=$(date -u +%s)
                  closed_grace=$(( CLOSED_GRACE_HOURS * 3600 ))
                  stale_secs=$(( STALE_DAYS * 86400 ))
                  work=$(mktemp -d)
                  failed=0
                  # an RFC 3339 time (Argo CD's "...Z", Forgejo's "...+03:00") as epoch seconds; "bad" for any other
                  epoch='def epoch: if . == null or . == "" then null else
                    (capture("^(?<t>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2})(\\.[0-9]+)?(?<z>Z|(?<s>[+-])(?<h>[0-9]{2}):?(?<m>[0-9]{2}))$") // {t: null}) as $c
                    | if $c.t == null then "bad" else ($c.t + "Z" | fromdateiso8601)
                        - (if $c.z == "Z" then 0 else ($c.s + "1" | tonumber) * (($c.h | tonumber) * 3600 + ($c.m | tonumber) * 60) end) end
                    end;'

                  # forgejo <path>: the API's answer; the token to curl on its stdin (-H @-), never on an argv
                  forgejo() {
                    printf 'Authorization: token %s\n' "$FORGEJO_TOKEN" \
                      | curl -fsS --connect-timeout 10 --max-time 30 -H @- "$FORGEJO_API/$1"
                  }
                  # preview_apps: "<name>|<pr>|<repo>|<last deploy, or creation, as epoch>" per preview Application
                  # with a PR number, none on its way out
                  preview_apps() {
                    kubectl get application -n argocd -l preview-env=true -o json > "$work/apps.json"
                    jq -r "$epoch"' .items[] | select(.metadata.deletionTimestamp == null)
                      | select((.metadata.labels."pr-number" // "") != "")
                      | [.metadata.name, .metadata.labels."pr-number", .metadata.labels."source-repo" // "",
                         ((.status.history[-1].deployedAt // .metadata.creationTimestamp) | epoch // "none")]
                      | map(tostring) | join("|")' "$work/apps.json"
                  }

                  # ── 1. Argo CD Application prune ─────────────────────
                  preview_apps > "$work/apps"
                  while IFS='|' read -r app pr repo deployed_epoch; do
                    case $deployed_epoch in
                      ''|*[!0-9]*) echo "[prune-app] $app: its deploy time unreadable ($deployed_epoch) - left" >&2
                        failed=1; continue ;;
                    esac
                    # the pull request itself (state, closed_at): read:repository reads it - an issue needs read:issue
                    if ! issue=$(forgejo "repos/schnappy/$repo/pulls/$pr"); then
                      echo "[prune-app] $app: PR $repo#$pr not read from Forgejo - left" >&2
                      failed=1; continue
                    fi
                    pr_state=$(printf '%s' "$issue" | jq -r '.state // "unknown"')
                    if [ "$pr_state" = "closed" ]; then
                      closed_epoch=$(printf '%s' "$issue" | jq -r "$epoch"' .closed_at | epoch // "none"')
                      case $closed_epoch in
                        *[!0-9]*) echo "[prune-app] $app: PR $repo#$pr closed at a time unreadable ($closed_epoch) - left" >&2
                          failed=1; continue ;;
                      esac
                      if [ $((now_epoch - closed_epoch)) -gt $closed_grace ]; then
                        echo "[prune-app] $app — PR closed > ${CLOSED_GRACE_HOURS}h ago"
                        kubectl delete application -n argocd "$app"
                        continue
                      fi
                    fi
                    if [ $((now_epoch - deployed_epoch)) -gt $stale_secs ]; then
                      echo "[prune-app] $app — head SHA stale > ${STALE_DAYS}d"
                      kubectl delete application -n argocd "$app"
                    fi
                  done < "$work/apps"

                  # ── 2. Vault prefix GC ───────────────────────────────
                  if [ -z "${VAULT_TOKEN:-}" ]; then
                    echo "[vault-gc] VAULT_TOKEN not set — skipping (provision secret/argocd/vault-cleanup-token to enable)"
                    exit $failed
                  fi
                  # vault <method> <path>: Vault's answer in $work/vault.json, verified against its CA; the token to
                  # curl on its stdin. A LIST of nothing is Vault's 404 - an empty answer; any other failure said, and
                  # the run fails
                  vault() {
                    rm -f "$work/vault.json"
                    code=$(printf 'X-Vault-Token: %s\n' "$VAULT_TOKEN" \
                      | curl -sS --cacert /vault-ca/ca.crt --connect-timeout 10 --max-time 30 -H @- \
                          -o "$work/vault.json" -w '%{http_code}' -X "$1" "$VAULT_ADDR/v1/$2") || code="no answer ($code)"
                    case $code in
                      2??) return 0 ;;
                      404) if [ "$1" = LIST ]; then echo '{}' > "$work/vault.json"; return 0; fi ;;
                    esac
                    echo "[vault-gc] $1 $2: $code $(head -c 300 "$work/vault.json" 2> /dev/null)" >&2
                    return 1
                  }
                  # purge <path/>: every key under it, a folder's too (a metadata DELETE removes a key, every version)
                  purge() {
                    vault LIST "secret/metadata/$1"
                    for k in $(jq -r '.data.keys[]?' "$work/vault.json"); do
                      case $k in
                        */) purge "$1$k" ;;
                        *) echo "[vault-gc] purge secret/$1$k"
                           vault DELETE "secret/metadata/$1$k" ;;
                      esac
                    done
                  }

                  vault POST auth/token/renew-self
                  echo "[vault-gc] token renewed for $(jq -r '.auth.lease_duration' "$work/vault.json") s"
                  # the PRs whose apps are left after the prune: their secrets stay
                  preview_apps > "$work/live"
                  live=" $(cut -d'|' -f2 "$work/live" | tr '\n' ' ') "
                  vault LIST secret/metadata/
                  prefixes=$(jq -r '.data.keys[]?' "$work/vault.json" | { grep -E '^schnappy-pr-[0-9]+/$' || true; })
                  echo "[vault-gc] preview prefixes in Vault: ${prefixes:-none}; live PRs:${live% }" | tr '\n' ' '
                  echo
                  for prefix in $prefixes; do
                    pr_num=${prefix#schnappy-pr-}
                    pr_num=${pr_num%/}
                    case $live in
                      *" $pr_num "*) continue ;;   # still in use; skip
                    esac
                    purge "$prefix"
                  done
                  exit $failed
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
                - { name: vault-ca, mountPath: /vault-ca, readOnly: true }
          volumes:
            - { name: tmp, emptyDir: {} }
            # Vault's CA (bootstrap.sh vault-eso): not optional - without it no run reads Vault verified
            - { name: vault-ca, secret: { secretName: vault-pi-ca } }
