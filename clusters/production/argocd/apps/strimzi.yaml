apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://strimzi.io/charts/
      chart: strimzi-kafka-operator
      targetRevision: 1.2.0
      helm:
        valueFiles:
          - $values/clusters/production/strimzi/values.yaml
    - repoURL: https://git.pmon.dev/schnappy/infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: strimzi
  # The 1.2.0 chart's Kafka CRD gives status.clusterSecurity an empty `properties: {}`, which the API server drops when
  # it stores the CRD: Argo's comparison saw it missing for ever and re-applied the CRD every 5 minutes (Vagrant,
  # 2026-10-03); a server-side diff of chart and cluster is empty.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: kafkas.kafka.strimzi.io
      jsonPointers:
        - /spec/versions/0/schema/openAPIV3Schema/properties/status/properties/clusterSecurity/properties
  syncPolicy:
    # no automated prune (as every app here): a resource the chart stops rendering stays until a person deletes it - a
    # prune would have deleted what Strimzi's CRDs and the Kafka clusters hang on
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
