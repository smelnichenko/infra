apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://strimzi.io/charts/
      chart: strimzi-kafka-operator
      targetRevision: 0.51.0
      helm:
        valueFiles:
          - $values/clusters/production/strimzi/values.yaml
    - repoURL: https://git.pmon.dev/schnappy/infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: strimzi
  syncPolicy:
    # No automated sync while the Strimzi resources and CRDs move to the v1 API (ops strimzi-v1-conversion.yml):
    # the 0.51 chart's CRDs store v1beta2 and a self-heal would put that back. Restored with the 1.x chart.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
