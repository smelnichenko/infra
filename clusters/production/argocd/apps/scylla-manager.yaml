apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scylla-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://scylla-operator-charts.storage.googleapis.com/stable
      chart: scylla-manager
      targetRevision: v1.21.1
      helm:
        valueFiles:
          - $values/clusters/production/scylla-manager/values.yaml
    - repoURL: https://git.pmon.dev/schnappy/infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: scylla-manager
  # the chart's ServiceMonitor relabeling names no action; the CRD defaults it to replace, which a server-side apply's
  # diff reports as drift for ever - the app OutOfSync after every sync (Vagrant full run 14, step 18)
  ignoreDifferences:
    - group: monitoring.coreos.com
      kind: ServiceMonitor
      jqPathExpressions:
        - .spec.endpoints[].metricRelabelings[]?.action
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
