apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: woodpecker
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: ghcr.io/woodpecker-ci/helm
      chart: woodpecker
      targetRevision: 3.7.3
      helm:
        valueFiles:
          - $values/clusters/production/woodpecker/values.yaml
    - repoURL: https://git.pmon.dev/schnappy/infra.git
      targetRevision: main
      ref: values
    # plain manifests beside the chart: the ci-cache PVC the pipelines mount
    - repoURL: https://git.pmon.dev/schnappy/infra.git
      targetRevision: main
      path: clusters/production/woodpecker/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: woodpecker
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
