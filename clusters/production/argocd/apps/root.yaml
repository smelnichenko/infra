apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://git.pmon.dev/schnappy/infra.git
    targetRevision: main
    path: clusters/production/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jqPathExpressions:
        - .status
        - .operation
      managedFieldsManagers:
        - argocd-controller
        - before-first-apply
  syncPolicy:
    automated:
      selfHeal: true
      # prune stays OFF on the root app-of-apps: a bad ApplicationSet render or a
      # force-sync must never cascade-delete every child Application. Leaf stateless
      # apps keep their own prune; removing a child here is a deliberate manual delete.
      prune: false
    syncOptions:
      - ServerSideApply=false
      - RespectIgnoreDifferences=true
