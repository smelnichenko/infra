apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://git.pmon.dev/schnappy/infra.git
    targetRevision: main
    path: clusters/production/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jqPathExpressions:
        - .status
        - .operation
        # apiserver-defaulted on directory sources; not in git
        - .spec.source.directory.jsonnet
      # No managedFieldsManagers here: every spec field the root itself applies is
      # owned by argocd-controller, so ignoring that manager made the root blind to
      # ALL child Application changes (woodpecker sat on chart 3.6.4 for months
      # while git said 3.6.5, and the root's own prune:false never applied).
  syncPolicy:
    automated:
      selfHeal: true
      # prune stays OFF on the root app-of-apps: a bad ApplicationSet render or a
      # force-sync must never cascade-delete every child Application. Leaf stateless
      # apps keep their own prune; removing a child here is a deliberate manual delete.
      prune: false
    syncOptions:
      - ServerSideApply=false
      - RespectIgnoreDifferences=true
