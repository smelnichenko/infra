apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: schnappy-sonarqube
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://git.pmon.dev/schnappy/platform.git
      targetRevision: main
      path: helm/schnappy-sonarqube
      helm:
        releaseName: schnappy
        valueFiles:
          - $values/clusters/production/schnappy-sonarqube/values.yaml
    - repoURL: https://git.pmon.dev/schnappy/infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: schnappy-infra
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # a sync that failed - one of its hooks among it (a PostSync hook runs after the chart's hook-templates ConfigMap
    # is applied: the app reads Synced, the hook not run) - tried again before it stays failed: auto-sync never retries
    # a revision by itself. A hook failing all four times keeps its Job, and KubeJobFailed says so
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
