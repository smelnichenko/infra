apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: porkbun-webhook
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://talinx.github.io/cert-manager-webhook-porkbun
    chart: cert-manager-webhook-porkbun
    # pinned: "*" moved with every new chart release, unreviewed - mid-rollout too
    targetRevision: 1.0.0
    helm:
      releaseName: porkbun
      parameters:
        - name: image.tag
          value: "1.0.0"
        - name: fullnameOverride
          value: porkbun-webhook
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      selfHeal: true
