apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scylla-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  # no resources finalizer: deleting this Application (a root prune, by hand) must never cascade to its CRDs and
  # every ScyllaCluster - chat's messages with them. Its chart offers no CRD annotations (external-secrets' carry Prune=false,Delete=false),
  # and automated prune is off (the wave-patches review, 2026-11-27)
spec:
  project: default
  sources:
    - repoURL: https://scylla-operator-charts.storage.googleapis.com/stable
      chart: scylla-operator
      targetRevision: v1.22.1
      helm:
        valueFiles:
          - $values/clusters/production/scylla-operator/values.yaml
    - repoURL: https://git.pmon.dev/schnappy/infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: scylla-operator
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
