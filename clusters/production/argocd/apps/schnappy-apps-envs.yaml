apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: schnappy-apps-envs
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://git.pmon.dev/schnappy/infra.git
        revision: main
        directories:
          - path: "clusters/production/schnappy-*-apps"
  template:
    metadata:
      name: '{{ .path.basenameNormalized }}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: https://git.pmon.dev/schnappy/platform.git
          targetRevision: main
          path: helm/schnappy
          helm:
            releaseName: '{{ index .path.segments 2 | trimSuffix "-apps" }}'
            valueFiles:
              - "$values/{{ .path.path }}/values.yaml"
        - repoURL: https://git.pmon.dev/schnappy/infra.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ index .path.segments 2 | trimSuffix "-apps" }}'
      syncPolicy:
        automated:
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        # a sync that failed - one of its hooks among it (a PostSync hook runs after the chart's hook-templates ConfigMap
        # is applied: the app reads Synced, the hook not run) - tried again before it stays failed: auto-sync never retries
        # a revision by itself. A hook failing all four times keeps its Job, and KubeJobFailed says so
        retry:
          limit: 3
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
