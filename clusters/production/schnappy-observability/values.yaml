vault:
  secretsEnabled: true

networkPolicies:
  enabled: true

clickhouse:
  enabled: true
  existingSecret: schnappy-clickhouse
  image: clickhouse/clickhouse-server:24.8-alpine
  resources:
    requests: { cpu: "50m", memory: "512Mi" }
    limits:   { cpu: "2",    memory: "8Gi" }
  storage:
    size: 20Gi
    storageClass: local-path
  retention:
    days: 30

fluentbit:
  enabled: true
  image: cr.fluentbit.io/fluent/fluent-bit:4.2.8
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits:   { cpu: "1000m", memory: "512Mi" }
  # its positions and buffer on ten's disk: a roll resumes where the last pod stopped and sends the chunks it left
  stateHostPath: /var/lib/fluent-bit
  # a chunk waits for ClickHouse however long it is down (a restart on an upgrade), the buffer bounded on disk
  retryLimit: no_limits
  bufferLimit: 512M

# OpenObserve was retired; logs are queried via Grafana's
# ClickHouse-Logs datasource. The chart no longer ships the
# openobserve.* values block.
  storage:
    size: 10Gi
    storageClass: local-path
  retention:
    days: 14
  externalSecret:
    enabled: true
    refreshInterval: 15m

prometheus:
  enabled: true
  scrapeInterval: 15s
  # Probed from a pod, so each must get 403 (schnappy-infra-mesh gatewayLanOnly).
  lanOnlyProbeUrls:
    - https://alerts.pmon.dev/-/ready
    - https://prometheus.pmon.dev/-/ready
    - https://hubble.pmon.dev/
    - https://reports.pmon.dev/
    - https://runbooks.pmon.dev/
    # the services' API docs (schnappy-infra-mesh gateway-docs-lan-only, 2026-09-22): one per API root
    - https://test.pmon.dev/api/masi/api-docs
    - https://test.pmon.dev/api/swagger-ui/index.html
    - https://test.pmon.dev/api/chess/api-docs
  scrapeNamespaces:
    - schnappy-production
    - schnappy-test
  woodpecker:
    enabled: false

gateway:
  enabled: true
  name: schnappy-infra-gateway
  namespace: schnappy-infra
  hosts:
    grafana: grafana.pmon.dev
    logs: logs.pmon.dev
    reports: reports.pmon.dev
    alerts: alerts.pmon.dev
    prometheus: prometheus.pmon.dev
    runbooks: runbooks.pmon.dev
  prometheusService: schnappy-prometheus

mimir:
  enabled: true
  image: grafana/mimir:3.2.1
  retention: 90d
  minioSecret: schnappy-infra-s3
  accessKeyName: ACCESS_KEY
  secretKeyName: SECRET_KEY
  minioEndpoint: schnappy-infra-s3gw.schnappy-infra.svc:9000
  storage: 5Gi
  storageClassName: local-path
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: 2000m, memory: 2Gi }

tempo:
  enabled: true
  image: grafana/tempo:3.1.0
  retention: 336h
  minioSecret: schnappy-infra-s3
  accessKeyName: ACCESS_KEY
  secretKeyName: SECRET_KEY
  minioEndpoint: schnappy-infra-s3gw.schnappy-infra.svc:9000
  storage: 2Gi
  storageClassName: local-path
  resources:
    requests: { cpu: 50m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 2Gi }

grafana:
  enabled: true
  existingSecret: schnappy-grafana
  image: grafana/grafana:13.2.3
  # Grafana 13's update of its preinstalled plugins at start fails on the read-only root and leaves the Mimir
  # datasource unregistered - off: the image's own plugin versions (platform's grafana-deployment.yaml says why)
  pluginsPreinstallAutoUpdate: false
  host: grafana.pmon.dev
  # kagent's grafana-mcp reaches the Grafana API with a read-only Viewer SA.
  extraIngressNamespaces:
    - kagent
  ingress:
    enabled: false
  oauth:
    enabled: true
    name: Keycloak
    authUrl: https://auth.pmon.dev/realms/schnappy/protocol/openid-connect/auth
    tokenUrl: https://auth.pmon.dev/realms/schnappy/protocol/openid-connect/token
    apiUrl: https://auth.pmon.dev/realms/schnappy/protocol/openid-connect/userinfo
    scopes: "openid profile email"
    autoLogin: false
  storage:
    size: 5Gi
    storageClass: local-path
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }

alertmanager:
  enabled: true
  logLevel: debug
  existingSecret: schnappy-alertmanager
  alertEmailTo: sergei.melnichenko@gmail.com
  alertEmailFrom: alerts@pmon.dev
  resources:
    requests: { cpu: 25m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }
  storage:
    size: 1Gi
    storageClass: local-path

kubeStateMetrics:
  enabled: true
  resources:
    requests: { cpu: 25m, memory: 128Mi }
    limits: { cpu: 200m, memory: 512Mi }

# Persistent metric sink for the manually-triggered DR drill (task dr:drill).
pushgateway:
  enabled: true

reports:
  enabled: true
  image: nginx:1.27-alpine
  minioEndpoint: schnappy-infra-s3gw.schnappy-infra.svc:9000

runbooks:
  enabled: true
  image: nginx:1.27-alpine

smartctl:
  enabled: true
  host: "192.168.11.2"
  port: 9633
