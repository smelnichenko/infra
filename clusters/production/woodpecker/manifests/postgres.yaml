apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: woodpecker-postgres
  namespace: woodpecker
spec:
  # One instance: CI is one agent on one node, and a second copy of a database this size buys nothing it needs. The
  # volume is on local-path, which cannot follow a pod to another node anyway.
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:19.0-system-trixie@sha256:04aba475dfd2ee7ad4a8ad22e77a3b5597cba7f48437ba014e9730e87d00ae4b
  storage:
    size: 5Gi
    storageClass: local-path
  bootstrap:
    initdb:
      database: woodpecker
      owner: woodpecker
      secret:
        name: woodpecker-db
      encoding: UTF8
      localeCType: C
      localeCollate: C
      postInitSQL:
        - GRANT ALL ON SCHEMA public TO woodpecker;
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # The default 30 s is short for a first start on this node: the init runs while the rest of the cluster is busy.
  probes:
    startup:
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 60
  monitoring:
    enablePodMonitor: false
  # Backed up to the Pi store as production's cluster is, under a name of its own there - empty when this landed (listed
  # 2026-11-17). CNPG's empty-archive check does NOT guard it: archiving was on long before (a no-op without a store),
  # so its check flag was gone - a name another cluster writes would be mixed with this one's WAL silently. A new
  # generation (a recovery, a major) takes a new serverName. It had no backup at all: a failed PostgreSQL major left
  # CI's history nothing to come back from, and the upgrade cycle blocked every Postgres major on it
  # (scripts/upgrade-stores.json in ops).
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://postgres-backups/
      endpointURL: http://192.168.11.5:9000
      serverName: woodpecker-postgres-pg18
      s3Credentials:
        accessKeyId:
          name: woodpecker-postgres-backup-store
          key: ACCESS_KEY
        secretAccessKey:
          name: woodpecker-postgres-backup-store
          key: SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
