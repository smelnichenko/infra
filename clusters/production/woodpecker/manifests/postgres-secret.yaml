apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-db-es
  namespace: woodpecker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: woodpecker-db
    # CNPG reads this secret to create the role, so it must exist before the cluster does; a template keeps the keys
    # named the way CNPG wants them however Vault stores them.
    # Both keys under the names their readers want: CNPG creates the role from `username`/`password`, while the server
    # takes the whole secret as env (extraSecretNamesForEnvFrom) and its DSN refers to WOODPECKER_DB_PASSWORD.
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        WOODPECKER_DB_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/schnappy/woodpecker-db
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/schnappy/woodpecker-db
        property: password
