# woodpecker-postgres's backups (postgres.yaml's spec.backup): the Pi store's credentials from Vault (backup-store - the
# ones production's cluster and Scylla's agents read), and a base backup once a day.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-postgres-backup-store
  namespace: woodpecker
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: woodpecker-postgres-backup-store
  data:
    - secretKey: ACCESS_KEY
      remoteRef:
        key: secret/data/schnappy/backup-store
        property: access_key
    - secretKey: SECRET_KEY
      remoteRef:
        key: secret/data/schnappy/backup-store
        property: secret_key
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: woodpecker-postgres-daily
  namespace: woodpecker
spec:
  # CNPG's schedule has a seconds field first: 01:15:00 every day, beside production's 01:30
  schedule: "0 15 1 * * *"
  # the first base backup when this lands, not the next night: WAL archived before one restores nothing
  immediate: true
  backupOwnerReference: cluster
  cluster:
    name: woodpecker-postgres
