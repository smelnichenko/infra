# CI takes two CPUs at most (operator 2026-10-10). Woodpecker runs one pipeline at a time (one agent, one workflow);
# this caps each of its containers at 2 CPUs and gives every container that states no limit 2 - in every repo, today's
# and future ones, whatever its pipeline file asks (a step asking more is refused). A pipeline's parallel steps and
# services are each their own container, each capped here.
apiVersion: v1
kind: LimitRange
metadata:
  name: ci-cpu
  namespace: woodpecker
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
      defaultRequest:
        cpu: 100m
      max:
        cpu: "2"
