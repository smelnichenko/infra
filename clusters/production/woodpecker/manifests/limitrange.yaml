# CI's CPU, decided here alone (operator 2026-10-10; 4 since 2026-10-17, 6 since 2026-11-16 - one pipeline at a time,
# the operator's): every container in the woodpecker namespace gets 6 CPUs by default and at most 6, in every repo,
# today's and future ones, whatever its pipeline file asks (one asking more is refused); no pipeline states a CPU.
# Woodpecker runs one pipeline at a time (one agent, one workflow), but this caps each container, not a pipeline: its
# parallel steps and services each take up to 6 (ops' four parallel checks up to 24). A namespace quota would cap the
# sum, but a step whose pod it refuses fails rather than waits.
apiVersion: v1
kind: LimitRange
metadata:
  name: ci-cpu
  namespace: woodpecker
spec:
  limits:
    - type: Container
      default:
        cpu: "6"
      defaultRequest:
        cpu: 100m
      max:
        cpu: "6"
