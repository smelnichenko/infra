server:
  createAgentSecret: false
  # Chart 3.7.3 (latest) pins appVersion v3.18.0; the image tag is overridden to
  # the latest Woodpecker release. Keep server and agent on the same tag. v3.18
  # migrated the log storage table on first start (back up the SQLite file before
  # a major/minor bump; allow a few minutes of downtime).
  image:
    tag: v3.18.1
  env:
    WOODPECKER_HOST: "https://ci.pmon.dev"
    WOODPECKER_FORGEJO: "true"
    WOODPECKER_FORGEJO_URL: "https://git.pmon.dev"
    WOODPECKER_ADMIN: "forgejo_admin,sm"
    WOODPECKER_OPEN: "true"
    WOODPECKER_LOG_LEVEL: "warn"
    # Never cancel a PUSH pipeline. Woodpecker cancels a running pipeline when a newer one starts
    # for the same branch, and its default event list is "push, pull_request" — so two merges to
    # main in a row killed the first one mid-flight, which on this cluster is a deployment.
    # Superseding a PR run is still right: that commit is already obsolete.
    #
    # The variable this replaces, WOODPECKER_PIPELINE_CANCEL_RUNNING, is NOT a Woodpecker option
    # (checked against `woodpecker-server --help` on v3.18.1): it was silently ignored, so the
    # cancelling has been on the whole time it looked disabled.
    #
    # DEFAULT means default for repos Woodpecker has not seen yet. Repos already registered keep
    # the setting stored against them and must be changed per repo (Settings -> Cancel previous
    # pipelines) or through the API.
    WOODPECKER_DEFAULT_CANCEL_PREVIOUS_PIPELINE_EVENTS: "pull_request"
    WOODPECKER_METRICS_SERVER_ADDR: ":9001"
  extraSecretNamesForEnvFrom:
    - woodpecker-forgejo-secret
    - woodpecker-default-agent-secret
    - woodpecker-ci-secrets
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  persistentVolume:
    enabled: true
    size: 1Gi
    storageClass: local-path
agent:
  image:
    tag: v3.18.1
  env:
    WOODPECKER_SERVER: "woodpecker-server:9000"
    WOODPECKER_BACKEND: "kubernetes"
    WOODPECKER_BACKEND_K8S_NAMESPACE: "woodpecker"
    WOODPECKER_BACKEND_K8S_ALLOW_NATIVE_SECRETS: "true"
    WOODPECKER_BACKEND_K8S_STORAGE_CLASS: "local-path"
    # Chart 3.6.x defaults this to true (ReadWriteMany), which the single-node
    # local-path provisioner can't satisfy (RWO/RWOP only) — pipeline PVCs hang
    # Pending and builds never start. RWO is correct here: all steps run on the
    # one node.
    WOODPECKER_BACKEND_K8S_STORAGE_RWX: "false"
    WOODPECKER_BACKEND_K8S_VOLUME_SIZE: "2Gi"
    WOODPECKER_MAX_WORKFLOWS: "1"
    WOODPECKER_CONNECT_RETRY_COUNT: "30"
    WOODPECKER_LOG_LEVEL: "warn"
    WOODPECKER_BACKEND_K8S_PULL_SECRET_NAMES: "forgejo-registry"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
