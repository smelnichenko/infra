server:
  createAgentSecret: false
  # Bumped past chart's bundled appVersion. Chart 3.5.1 ships v3.13.0;
  # Woodpecker UI prompts to update to v3.14.0 (released 2026-05-01).
  # Drop these overrides once chart 3.6.x ships v3.14.0+.
  image:
    tag: "v3.14.0"
  env:
    WOODPECKER_HOST: "https://ci.pmon.dev"
    WOODPECKER_FORGEJO: "true"
    WOODPECKER_FORGEJO_URL: "https://git.pmon.dev"
    WOODPECKER_ADMIN: "forgejo_admin,sm"
    WOODPECKER_OPEN: "true"
    WOODPECKER_LOG_LEVEL: "warn"
    WOODPECKER_PIPELINE_CANCEL_RUNNING: "false"
    WOODPECKER_METRICS_SERVER_ADDR: ":9001"
  extraSecretNamesForEnvFrom:
    - woodpecker-forgejo-secret
    - woodpecker-default-agent-secret
    - woodpecker-ci-secrets
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  persistentVolume:
    enabled: true
    size: 1Gi
    storageClass: local-path
agent:
  image:
    tag: "v3.14.0"
  env:
    WOODPECKER_SERVER: "woodpecker-server:9000"
    WOODPECKER_BACKEND: "kubernetes"
    WOODPECKER_BACKEND_K8S_NAMESPACE: "woodpecker"
    WOODPECKER_BACKEND_K8S_ALLOW_NATIVE_SECRETS: "true"
    WOODPECKER_BACKEND_K8S_STORAGE_CLASS: "local-path"
    WOODPECKER_BACKEND_K8S_VOLUME_SIZE: "2Gi"
    WOODPECKER_MAX_WORKFLOWS: "1"
    WOODPECKER_CONNECT_RETRY_COUNT: "30"
    WOODPECKER_LOG_LEVEL: "warn"
    WOODPECKER_BACKEND_K8S_PULL_SECRET_NAMES: "forgejo-registry"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
