chessService:
  enabled: true
  image:
    repository: git.pmon.dev/schnappy/chess
    pullPolicy: IfNotPresent
    tag: "e5a1654"  # chess
  replicas: 1
  javaOpts: -Xmx1g -XX:+UseZGC
  resources:
    requests: { cpu: 500m, memory: 1536Mi }
    limits: { cpu: 3000m, memory: 2Gi }

# masi — job registry with reviewed CV tuning (/api/masi). On in production since 2026-10-18 (operator: "Deploy masi to
# prod"). AI on its own Vault path schnappy/ai-masi holding the same key as test (ops/.env MASI_ANTHROPIC_API_KEY =
# ANTHROPIC_API_KEY, operator 2026-10-18): each namespace has its own 2.30 USD/day ledger, so the key can spend up to
# 4.60 USD a day while test and production both run. tuning.auto off (a Prepare in the UI is what costs a tune); the
# background analysis, AI match and company visits run once sources are switched on (a fresh database has all off).
# The partner API is off (masi.partner.enabled defaults to false; operator 2026-10-18: until further notice).
# One replica until masi runs as equal pods.
# To stop it: replicas: 0 and ai.enabled: false, keeping enabled: true - enabled: false only stops RENDERING masi, and
# this app syncs without prune, so its Deployment would keep running (AI and collectors on) with its alerts gone.
# Removing it for good is deleting its resources by name with the operator's OK, never a prune.
masiService:
  enabled: true
  image:
    repository: git.pmon.dev/schnappy/masi
    pullPolicy: IfNotPresent
    tag: "e9b57ce"  # masi
  http:
    # any public host (plan 104 PR 1, masi #124; operator 2026-10-19 of the exact-name list: "fuck that guard...
    # idiocy"): a new source needs no host entry. Internal addresses stay refused by masi's UrlValidator and by the
    # pod's network policy. Ships in the same push as masi e0dc51a: an older image reads "*" as a literal host.
    allowedHosts: ["*"]
  # two equal pods (plan 099; operator 2026-10-19: "1 pod again?" / one pod "better suits test env"): every pod runs every
  # lane, claims per slot and per package in the database; the chart halves the browser's sessions per pod and adds a
  # disruption budget. Test stays at one.
  replicas: 2
  # more heap than test's 512m for production's data; two virtual-thread carriers kept even if the limit drops to one CPU
  javaOpts: -Xmx768m -XX:+UseZGC -Djdk.virtualThreadScheduler.parallelism=2
  resources:
    # 250m as test: at 50m a busy node made startup overrun the 300 s startup probe (test, 2026-09-26). Memory at the
    # measured working set (test's container: 827Mi on a 512m heap; more heap here), not below it
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: 2000m, memory: 2048Mi }
  ai:
    enabled: true
    existingSecret: "schnappy-production-masi-ai"
    workspaceId: ""
    tuningModel: "claude-sonnet-5"
    extractModel: "claude-haiku-4-5-20251001"
    matchModel: "claude-haiku-4-5-20251001"
    dailyBudgetUsd: "2.30"
    monthlyBudgetUsd: "10"
  tuning:
    auto: false
  analysis:
    auto: true
    perTick: 10
    matchAuto: true
    matchPerTick: 10
  enrich:
    enabled: true
    contactPictures:
      enabled: true
      maxRequestsPerDay: 100
      linkedin: true
      nameSearch: true
  mail:
    # nothing is mailed on a schedule: a digest leaves when its reader asks for it
    enabled: true
    weeklyAuto: false
    siteUrl: https://pmon.dev
  assistant:
    # the virtual assistant's own Gmail (its correspondence, not masi's system mail): username + app password
    gmailUsername: "sergei.melnichenko@gmail.com"
    gmailPassword: ""
  collector:
    # the operator's GitHub PAT (public read only) — pasted here when he makes one; empty = anonymous 60/hour
    githubToken: ""
    # the operator's LinkedIn session cookie (li_at): with it the wildcard reads the company pages themselves
    linkedinLiAt: "AQEDARAqWlQFyFPrAAABoH_z0fQAAAGhfSc5UU0Akz3scrAz2LSxtB5QHvreaI3_dYzAO4HU6xBROMyEyW69jbiNFw30g3nGBlantoCZpa38_FLsrqY1XAU8Pqg9Uxcere2rls2LNOS8UwJHkUh8xAXo"
  alerts:
    # on: one daily digest at 06:00 — pipeline ERRORs and matches above the score
    enabled: true
    to: sergei.melnichenko@gmail.com
    matchScore: 0.8
  apply:
    # Send on the operator's click (plan 103; operator 2026-10-19: "Send on my click", "deploy masi to prod as soon as
    # it is ready"): a REVIEWED package mailed to the contact its own posting names, one press = one mail, never on a
    # schedule. Production is the environment that mails real recruiters ("production is the main/mail environment");
    # the Vagrant copy's overlay switches this off. Resend signs pmon.dev only, so the sender is a pmon.dev address and
    # a recruiter's answer reaches the operator through Reply-To; the Bcc is the operator's copy of what was sent.
    enabled: true
    production: true
    from: "Sergei Melnichenko <apply@pmon.dev>"
    replyTo: sergei.melnichenko@gmail.com
    bcc: sergei.melnichenko@gmail.com
  browser:
    enabled: true
    existingSecret: schnappy-production-masi-browser
    resources:
      requests: { cpu: 25m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 1536Mi, ephemeral-storage: 2Gi }

tracing:
  enabled: true
  # Chart-default exporter: OTLP/HTTP to schnappy-tempo.schnappy-infra:4318
  # (the namespace default-deny must allow that egress).
  samplingProbability: "0.01"

smokeTest:
  enabled: true
  image: grafana/k6:1.7.1
  baseUrl: https://pmon.dev
  clientSecretName: schnappy-k6-smoke

hyperfoil:
  enabled: true
  reportsUrl: https://reports.pmon.dev
  clientSecretName: schnappy-hyperfoil
  # Reports go to the infra s3gw (versitygw), where the reports nginx serves them.
  s3Endpoint: schnappy-infra-s3gw.schnappy-infra.svc:9000

