# masi — job registry with reviewed CV tuning (/api/masi). On in production since 2026-10-18 (operator: "Deploy masi to
# prod"), the settings test proved: masi's AI on its own Vault path schnappy/ai-masi (the same key as test, operator
# 2026-10-18 - one Anthropic key, see the shared-key decision), budgets as test's, tuning.auto off (a Prepare in the UI
# is what costs a tune), the background analysis, AI match and company visits on. The partner API stays off (operator
# 2026-10-18): it answers only partners that exist, and none is seeded. One replica until masi runs as equal pods.
masiService:
  enabled: true
  image:
    repository: git.pmon.dev/schnappy/masi
    pullPolicy: IfNotPresent
    tag: "c87ed98"  # masi
  replicas: 1
  # two carriers for virtual threads on one CPU: a request thread is never left waiting behind one busy virtual thread
  javaOpts: -Xmx768m -XX:+UseZGC -Djdk.virtualThreadScheduler.parallelism=2
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 2000m, memory: 1536Mi }
  ai:
    enabled: true
    existingSecret: "schnappy-production-masi-ai"
    dailyBudgetUsd: "2.30"
    monthlyBudgetUsd: "10"
  tuning:
    auto: false
  analysis:
    auto: true
    perTick: 10
    matchAuto: true
    matchPerTick: 10
  enrich:
    enabled: true
  mail:
    # nothing is mailed on a schedule (weeklyAuto stays false): a digest leaves when its reader asks for it
    enabled: true
    siteUrl: https://pmon.dev
  browser:
    enabled: true
    existingSecret: schnappy-production-masi-browser
    resources:
      requests: { cpu: 25m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 1536Mi, ephemeral-storage: 2Gi }

tracing:
  enabled: true
  # Chart-default exporter: OTLP/HTTP to schnappy-tempo.schnappy-infra:4318
  # (the namespace default-deny must allow that egress).
  samplingProbability: "0.01"

smokeTest:
  enabled: true
  image: grafana/k6:1.7.1
  baseUrl: https://pmon.dev
  clientSecretName: schnappy-k6-smoke

hyperfoil:
  enabled: true
  reportsUrl: https://reports.pmon.dev
  clientSecretName: schnappy-hyperfoil
  # Reports go to the infra s3gw (versitygw), where the reports nginx serves them.
  s3Endpoint: schnappy-infra-s3gw.schnappy-infra.svc:9000

# Cross-chart references (secret names for env var mounts, keycloak for admin service)
postgres:
