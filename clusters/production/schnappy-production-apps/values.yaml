vault:
  secretsEnabled: true

alerts:
  enabled: true

app:
  # two: with one replica and maxSurge 0 every deploy took pmon.dev down; now a deploy rolls one at a time. Each scheduled
  # check runs once across both (a claim row per slot, monitor f5c59ab; proven on test 2026-10-18) (operator: "give it 2
  # replicas!")
  replicas: 2
  javaOpts: -Xmx2g -XX:+UseZGC -XX:+UseStringDeduplication
  image:
    pullPolicy: IfNotPresent
    repository: git.pmon.dev/schnappy/monitor
    tag: "83018a8"  # monitor
  ingress:
    enabled: false
  hikari:
    maximumPoolSize: 50
    minimumIdle: 5
    connectionTimeout: 20000
    idleTimeout: 300000
    maxLifetime: 1200000
  resources:
    # CPU request sized from the load test: monitor peaks ~4.4 cores under a
    # 1000 req/s stress run; 750m is the guaranteed floor (1500m until the
    # cluster-wide halving of requests on 2026-10-01) while the 6000m limit
    # absorbs the burst. The single-node rolling-update wedge is handled
    # by maxSurge:0 on the Deployment, not by starving this request.
    requests: { cpu: 750m, memory: 3Gi, ephemeral-storage: 256Mi }
    limits: { cpu: 6000m, memory: 4Gi, ephemeral-storage: 1Gi }

site:
  enabled: true
  # two: a deploy rolls one at a time (the default rolling update), so the site never goes dark (operator 2026-10-18)
  replicas: 2
  dnsResolver: "10.43.0.10"
  image:
    pullPolicy: IfNotPresent
    repository: git.pmon.dev/schnappy/site
    tag: "46b0188"  # site
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 2000m, memory: 256Mi }

games:
  - name: game-scp
    path: game
    image:
      repository: git.pmon.dev/schnappy/game-scp
      tag: "216c611"  # game-scp
    resources:
      requests: { cpu: 25m, memory: 32Mi }
      limits: { cpu: 100m, memory: 64Mi }

auth:
  existingSecret: schnappy-production-auth
  registrationEnabled: true
  secureCookies: true
  tokenExpiration: 1h
  registrationApproval:
    mode: ai
    defaultGroup: Users

captcha:
  enabled: true

chess:
  enabled: true

chat:
  e2eEnabled: false


monitor:
  enabled: true
  http:
    connectTimeout: 10s
    readTimeout: 30s
    userAgent: MonitorBot/1.0

networkPolicies:
  enabled: true

strimzi:
  enabled: true

cnpg:
  enabled: true

scyllaOperator:
  enabled: true

ai:
  enabled: true
  existingSecret: schnappy-production-ai
  model: claude-haiku-4-5-20251001

mail:
  enabled: true
  existingSecret: schnappy-production-mail
  host: smtp.resend.com
  port: "587"
  username: resend
  fromAddress: noreply@pmon.dev
  appUrl: https://pmon.dev

webhook:
  enabled: true
