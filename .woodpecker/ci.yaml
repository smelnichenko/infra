# CI: validate the GitOps manifests on every push.
#
# The only other gate for this repo is Argo CD applying to the live cluster.
# kubeconform checks every plain manifest (cluster-config, argocd apps, …)
# against the Kubernetes and CRD JSON schemas; -strict rejects unknown fields
# (the class of typo that would otherwise silently widen a NetworkPolicy).
# Helm values files carry no kind and are skipped by kubeconform.

# Every PUSH runs it, a branch's and main's; no pull request does (2026-11-24). A change is built on its
# branch (a change of ours on its way, a Renovate unit) and its pull request opened to merge a head already
# green - one run per push, never two on the same sha (pull_request beside push ran both). A red branch
# shows on its commit and pages nobody: WoodpeckerBuildFailed counts failed pipelines on main alone, and a
# branch push's pipeline carries its own branch (a pull request's carried main, so every red PR paged).
# Main's own pushes run it too - the merge commit (two branches each green apart can still break main
# together) and CD's app promotions: Argo applies main to the live cluster, so what lands is checked here.
when:
  - event: push

clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      home: /tmp  # non-root: its credentials file in a home it can write
      partial: false
      depth: 50
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }

steps:
  - name: kubeconform
    image: ghcr.io/yannh/kubeconform:v0.7.0-alpine
    commands:
      # the alpine image ships the binary at /kubeconform, not on PATH
      - >-
        /kubeconform -strict -summary -ignore-missing-schemas -ignore-filename-pattern 'values\.yaml$'
        -kubernetes-version 1.34.0
        -schema-location default
        -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
        clusters/production/cluster-config
        clusters/production/argocd
        clusters/production/kagent
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
    environment:
      HOME: /tmp  # no user of its own in the image: a home it can write
  # every Job's and CronJob's pods out of Velero's backups (the script says why)
  - name: velero-exclude
    image: ghcr.io/yannh/kubeconform:v0.7.0-alpine
    commands:
      - sh .woodpecker/velero-exclude-check.sh
      # Woodpecker's server and agent on one release (the script says why)
      - sh .woodpecker/woodpecker-tags-check.sh
      # no Argo CD application prunes (the script says why)
      - sh .woodpecker/no-prune-check.sh
      # each environment's mesh PeerAuthentication exceptions (the script says why)
      - sh .woodpecker/mesh-values-check.sh
      # the apps with sync hooks retry a failed sync (a failed hook not left unrun)
      - sh .woodpecker/hook-retry-check.sh
      # ScyllaDB's version said once in each data environment, and Renovate able to move it (the script says why)
      - sh .woodpecker/scylla-version-check.sh
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
    environment:
      HOME: /tmp  # no user of its own in the image: a home it can write

  # the stale PR env sweeper's script run as its CronJob runs it - in its image (the test checks it is the CronJob's),
  # busybox sh - against stub kubectl and curl
  - name: stale-pr-envs-sweeper
    image: alpine/k8s:1.35.10
    commands:
      - bash tests/stale-pr-envs-sweeper/run.sh
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
    environment:
      HOME: /tmp  # no user of its own in the image: a home it can write

  # the restore check's age check run as its CronJob runs it - in its image (the test checks it is the CronJob's), busybox
  # sh - against a stub rclone
  - name: restore-check-age
    image: rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
    environment:
      HOME: /tmp  # no user of its own in the image: a home it can write
      CI_STEP_IMAGE_CHECK: rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
    commands:
      - sh tests/restore-check-age/run.sh
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
