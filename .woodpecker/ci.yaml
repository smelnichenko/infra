# CI: validate the GitOps manifests on every push / PR.
#
# The only other gate for this repo is Argo CD applying to the live cluster.
# kubeconform checks every plain manifest (cluster-config, argocd apps, …)
# against the Kubernetes and CRD JSON schemas; -strict rejects unknown fields
# (the class of typo that would otherwise silently widen a NetworkPolicy).
# Helm values files carry no kind and are skipped by kubeconform.

# ONCE per commit. Listing both events fired BOTH pipelines for every push to a branch with an open
# PR - two identical runs of the same checks on the same sha, racing for the same agent (seen on
# schnappy-data, 2026-09-17). A PR branch is covered by its pull_request run; main is covered by the
# push that merges it, which is what Argo then applies.
when:
  - event: pull_request
  - event: push
    branch: main

clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 50

steps:
  - name: kubeconform
    image: ghcr.io/yannh/kubeconform:v0.7.0-alpine
    commands:
      # the alpine image ships the binary at /kubeconform, not on PATH
      - >-
        /kubeconform -strict -summary -ignore-missing-schemas -ignore-filename-pattern 'values\.yaml$'
        -kubernetes-version 1.34.0
        -schema-location default
        -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
        clusters/production/cluster-config
        clusters/production/argocd
        clusters/production/kagent
